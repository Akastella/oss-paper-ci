# SARIF Upload
#
# Uploads reproducibility results to GitHub Code Scanning.
# Uses the GitHub Action. Replace Akastella/oss-paper-ci after publication.

name: SARIF Upload

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  security-events: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run oss-paper-ci
        uses: Akastella/oss-paper-ci@v1
        with:
          path: "."
          format: "sarif"
          output: "oss-paper-ci.sarif"

      - name: Upload SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: oss-paper-ci.sarif
