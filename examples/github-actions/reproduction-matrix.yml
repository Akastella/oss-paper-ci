# Example: Matrix execution in CI
#
# This workflow runs a matrix plan and uploads the report as an artifact.
# Matrix does not auto-install Python versions; missing runtimes are marked unavailable.

name: Reproduction Matrix

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  matrix:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install oss-paper-ci
        run: pip install oss-paper-ci  # after PyPI

      - name: Run matrix variant
        run: |
          oss-paper-ci session start examples/repro-system-demo \
            --name matrix-${{ matrix.python-version }} \
            --output-dir .oss-paper-ci-sessions/matrix-${{ matrix.python-version }}

      - name: Generate report
        run: |
          oss-paper-ci session report .oss-paper-ci-sessions/matrix-${{ matrix.python-version }} \
            --format markdown --output session-${{ matrix.python-version }}.md

      - name: Upload variant report
        uses: actions/upload-artifact@v4
        with:
          name: matrix-${{ matrix.python-version }}
          path: session-${{ matrix.python-version }}.md
