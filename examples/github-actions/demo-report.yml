# Demo Report Workflow
#
# Generates a full reproducibility report with SARIF and baseline comparison.
# Uses the GitHub Action. Replace Akastella/oss-paper-ci@v1.0.0rc1 with
# a stable tag after publication.

name: Demo Reproducibility Report

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read
  security-events: write
  pull-requests: write

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Generate Markdown report
        uses: Akastella/oss-paper-ci@v1.0.0rc1
        with:
          path: "."
          format: "markdown"
          output: "oss-paper-ci-report.md"

      - name: Generate SARIF report
        uses: Akastella/oss-paper-ci@v1.0.0rc1
        with:
          path: "."
          format: "sarif"
          output: "oss-paper-ci.sarif"

      - name: Upload SARIF to Code Scanning
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: oss-paper-ci.sarif

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: oss-paper-ci-reports
          path: |
            oss-paper-ci-report.md
            oss-paper-ci.sarif

      - name: Comment PR
        if: github.event_name == 'pull_request' && always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const report = fs.readFileSync('oss-paper-ci-report.md', 'utf8');
            const body = `## Reproducibility Report\n\n${report}`;
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find(c =>
              c.user.type === 'Bot' && c.body.includes('Reproducibility Report')
            );
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }
