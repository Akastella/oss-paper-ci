# Use GitHub Action
#
# This workflow uses the oss-paper-ci GitHub Action directly.
# Requires: oss-paper-ci has been published to GitHub with a tag (e.g. v1).
# Replace Akastella/oss-paper-ci with the actual repository after publication.

name: Reproducibility Check (Action)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run oss-paper-ci
        uses: Akastella/oss-paper-ci@v1
        with:
          path: "."
          format: "markdown"
          output: "oss-paper-ci-report.md"

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: oss-paper-ci-report
          path: oss-paper-ci-report.md
