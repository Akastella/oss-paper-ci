# PR Comment
#
# Posts reproducibility report as a PR comment.
# Uses the GitHub Action. Replace Akastella/oss-paper-ci after publication.
# Note: Fork PRs may not have permission to post comments.

name: PR Comment

on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run oss-paper-ci
        uses: Akastella/oss-paper-ci@v1
        with:
          path: "."
          format: "markdown"
          output: "report.md"

      - name: Comment PR
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const report = fs.readFileSync('report.md', 'utf8');
            const body = `## Reproducibility Report\n\n${report}`;
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find(c =>
              c.user.type === 'Bot' && c.body.includes('Reproducibility Report')
            );
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reproducibility-report
          path: report.md
