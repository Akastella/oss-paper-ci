# Example: Compare current scan against a previous report
name: Report Diff Regression
on: [pull_request]

permissions:
  contents: read

jobs:
  reproducibility:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.10'

      - name: Install oss-paper-ci
        run: python -m pip install oss-paper-ci  # after PyPI publication

      - name: Run scan
        run: |
          oss-paper-ci scan . --format json --output new-report.json

      - name: Download previous report
        uses: actions/download-artifact@v4
        with:
          name: previous-report
          path: old-report.json
        continue-on-error: true

      - name: Compare reports
        if: success()
        run: |
          if [ -f old-report.json ]; then
            oss-paper-ci diff --old old-report.json --new new-report.json --format markdown --output diff-report.md
          else
            echo "No previous report found, skipping diff."
          fi

      - name: Upload new report
        uses: actions/upload-artifact@v7
        with:
          name: previous-report
          path: new-report.json

      - name: Upload diff
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: diff-report
          path: diff-report.md
