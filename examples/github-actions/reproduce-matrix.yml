name: Reproduce Matrix

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  matrix-detect:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
      fail-fast: false

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install oss-paper-ci
        run: pip install -e .

      - name: Detect adapters
        run: |
          oss-paper-ci adapters inspect . --format json > adapters.json
          oss-paper-ci adapters doctor . --format json > doctor.json

      - name: Check runtime availability
        run: |
          # Gracefully handle missing runtimes
          python -c "
          import json
          with open('doctor.json') as f:
              data = json.load(f)
          for adapter in data.get('detected_adapters', []):
              rt = adapter.get('runtime', {})
              if rt and not rt.get('available', False):
                  print(f'WARNING: {adapter[\"display_name\"]} runtime not available: {rt.get(\"name\", \"unknown\")}')
          "

      - name: Generate plan (with graceful missing runtime handling)
        run: |
          oss-paper-ci adapters plan . --format json > plan.json || echo "Plan generation completed with warnings"

      - name: Upload matrix reports
        uses: actions/upload-artifact@v4
        with:
          name: matrix-py${{ matrix.python-version }}
          path: |
            adapters.json
            doctor.json
            plan.json
