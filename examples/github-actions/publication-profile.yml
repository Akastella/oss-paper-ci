# Example: Use the publication policy profile
name: Publication Readiness Check
on: [push, pull_request]

permissions:
  contents: read

jobs:
  reproducibility:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: Akastella/oss-paper-ci@v1
        with:
          profile: publication
          format: json
          output: oss-paper-ci-report.json
          fail-under: '90'
          step-summary: 'true'
