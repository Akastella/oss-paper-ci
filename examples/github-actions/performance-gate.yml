# Example: Run performance gate
name: Performance Gate
on: [pull_request]

permissions:
  contents: read

jobs:
  performance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install oss-paper-ci
        run: python -m pip install "${{ github.action_path }}"

      - name: Run performance gate
        run: |
          python scripts/performance_gate.py --max-seconds 30 --format json --output performance.json

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: performance-results
          path: performance.json
