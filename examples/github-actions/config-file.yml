# Example: Use a custom config file
name: Config-Driven Reproducibility Check
on: [push, pull_request]

permissions:
  contents: read

jobs:
  reproducibility:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: Akastella/oss-paper-ci@v1
        with:
          config: .oss-paper-ci.yml
          format: markdown
          output: oss-paper-ci-report.md
          step-summary: 'true'
