# Example: Use custom rule packs
name: Custom Rules Check
on: [push, pull_request]

permissions:
  contents: read

jobs:
  reproducibility:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: Akastella/oss-paper-ci@v1
        with:
          rules: examples/rule-packs/lab-reproducibility-rules.yml
          format: markdown
          output: oss-paper-ci-report.md
          step-summary: 'true'
