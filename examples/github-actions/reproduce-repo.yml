name: Reproduce Paper Repository

on:
  workflow_dispatch:
    inputs:
      repo_url:
        description: "GitHub repository URL to reproduce"
        required: true
        type: string
      execute:
        description: "Execute reproduction commands (true/false)"
        required: false
        default: "false"
        type: string
      timeout:
        description: "Per-command timeout in seconds"
        required: false
        default: "300"
        type: string

jobs:
  reproduce:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout oss-paper-ci
        uses: actions/checkout@v4
        with:
          repository: Akastella/oss-paper-ci
          path: tool

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install oss-paper-ci
        run: pip install ./tool

      - name: Run reproduce (dry-run)
        if: inputs.execute != 'true'
        run: |
          oss-paper-ci reproduce "${{ inputs.repo_url }}" \
            --dry-run \
            --format html \
            --output reproduce-report.html

      - name: Run reproduce (execute)
        if: inputs.execute == 'true'
        run: |
          oss-paper-ci reproduce "${{ inputs.repo_url }}" \
            --execute \
            --install \
            --timeout ${{ inputs.timeout }} \
            --format html \
            --output reproduce-report.html

      - name: Upload reproduction report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reproduce-report
          path: reproduce-report.html
