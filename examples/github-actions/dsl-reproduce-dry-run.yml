# Example: Dry-run reproduction with DSL v1
#
# This workflow validates the DSL, generates an execution plan, and runs
# a dry-run reproduction.  No commands are actually executed; the plan
# is uploaded as an artifact for review.

name: DSL Reproduce (Dry Run)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  reproduce-dry-run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install oss-paper-ci
        run: pip install -e ".[dev]"

      - name: Validate DSL
        run: |
          oss-paper-ci dsl validate reproducibility.yml \
            --format json \
            --output validation.json

      - name: Generate execution plan
        run: |
          oss-paper-ci dsl plan reproducibility.yml \
            --format json \
            --output plan.json

      - name: Generate execution plan (markdown)
        run: |
          oss-paper-ci dsl plan reproducibility.yml \
            --format markdown \
            --output plan.md

      - name: Explain DAG structure
        run: |
          oss-paper-ci dsl explain reproducibility.yml \
            --format markdown \
            --output dag-explain.md

      - name: Run reproduce dry-run
        run: |
          oss-paper-ci reproduce . \
            --dry-run \
            --format markdown \
            --output reproduce-report.md

      - name: Upload dry-run artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dsl-dry-run
          path: |
            validation.json
            plan.json
            plan.md
            dag-explain.md
            reproduce-report.md

      - name: Summary
        if: always()
        run: |
          echo "## Reproduction Dry-Run" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          cat plan.md >> $GITHUB_STEP_SUMMARY
