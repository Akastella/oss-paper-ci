version: 1
profile: strict

# Strict profile: stricter governance for mature projects.
# Missing LICENSE, environment, data description are blocking.

paths:
  include:
    - "."
  exclude:
    - ".git/"
    - "dist/"
    - "build/"
    - "__pycache__/"
    - ".pytest_cache/"

thresholds:
  pass_score: 90
  warn_score: 70
  fail_under: 50

checks:
  disabled: []
  severity_overrides: {}

reports:
  default_format: markdown
  include_recommendations: true
  max_findings: 50

ci:
  github_annotations: true
  step_summary: true
