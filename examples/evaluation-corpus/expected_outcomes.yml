# Expected outcomes for oss-paper-ci evaluation corpus
# These are the expected scan results for each test repository.

- repo_id: python_good_repro
  expected_ecosystems:
    - python
  expected_status: good
  expected_major_findings:
    - "Has requirements.txt"
    - "Has reproducibility.yml"
    - "Has data documentation"
    - "Has results/metrics.json"
    - "Has LICENSE"
  expected_score_band: [80, 100]
  expected_risks: []
  expected_scaffold_suggestions: []
  should_execute_by_default: false

