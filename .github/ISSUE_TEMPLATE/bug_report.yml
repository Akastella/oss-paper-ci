name: Bug Report
description: Report a bug or unexpected behavior in oss-paper-ci
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug. Please fill in the details below so we can reproduce and fix the issue.

  - type: input
    id: version
    attributes:
      label: oss-paper-ci version
      description: Output of `oss-paper-ci version`
      placeholder: "1.1.0rc1"
    validations:
      required: true

  - type: input
    id: python
    attributes:
      label: Python version
      description: Output of `python --version`
      placeholder: "Python 3.12.0"
    validations:
      required: true

  - type: input
    id: os
    attributes:
      label: Operating system
      placeholder: "Ubuntu 22.04 / Windows 11 / macOS 14"
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Describe the bug clearly.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
      description: What should have happened instead?
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: Provide the exact commands or steps to reproduce the issue.
      placeholder: |
        1. Run `oss-paper-ci scan .`
        2. ...
    validations:
      required: true

  - type: textarea
    id: output
    attributes:
      label: Relevant output
      description: Paste terminal output, error messages, or report excerpts.
      render: shell

  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Any other relevant information (repo structure, config file, etc.)
