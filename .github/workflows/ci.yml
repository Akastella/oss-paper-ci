name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run tests
        run: python -m pytest tests/ -v

      - name: Self-scan
        run: python -m oss_paper_ci scan . --format json

      - name: Wizard (plain mode)
        run: python -m oss_paper_ci wizard --plain .
        env:
          NO_COLOR: "1"
          OSS_PAPER_CI_NO_ANIMATE: "1"

      - name: Workbench (plain mode)
        run: python -m oss_paper_ci workbench --plain examples/demo-reproduce-repo
        env:
          NO_COLOR: "1"
          OSS_PAPER_CI_NO_ANIMATE: "1"

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: pip install -e ".[dev]"

      - name: Check imports
        run: python -c "from oss_paper_ci import __version__; print(__version__)"
