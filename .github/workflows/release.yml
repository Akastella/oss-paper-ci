name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install -e ".[dev]"

      - name: Run tests
        run: python -m pytest tests/ -v

      - name: Clean test artifacts
        run: |
          rm -rf examples/demo-reproduce-repo/.oss-paper-ci-repro
          rm -f examples/demo-reproduce-repo/results/metrics.json

      - name: Build package
        run: |
          python -m build
          python -m twine check dist/*

      - name: Get version from tag
        id: version
        run: echo "version=${GITHUB_REF#refs/tags/v}" >> "$GITHUB_OUTPUT"

      - name: Create release package
        run: python scripts/make_release_package.py --version ${{ steps.version.outputs.version }}

      - name: Verify clean package
        run: python scripts/verify_clean_package.py --zip release-artifacts/oss-paper-ci-v${{ steps.version.outputs.version }}-github-clean.zip

      - name: Upload release artifacts
        uses: actions/upload-artifact@v7
        with:
          name: release-artifacts
          path: release-artifacts/
