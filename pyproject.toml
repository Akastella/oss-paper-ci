[build-system]
requires = ["setuptools>=68.0", "setuptools-scm>=8.0"]
build-backend = "setuptools.build_meta"

[project]
name = "oss-paper-ci"
version = "2.5.0rc1"
description = "CLI toolkit for checking, attempting, and packaging scientific repository reproducibility evidence"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [
    { name = "oss-paper-ci contributors" },
]
keywords = ["reproducibility", "science", "ci", "paper", "open-source"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering",
    "Topic :: Software Development :: Quality Assurance",
]
dependencies = [
    "pyyaml>=6.0",
    "rich>=13.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "build>=1.0",
    "twine>=5.0",
]

[project.scripts]
oss-paper-ci = "oss_paper_ci.cli:main"

[project.urls]
Homepage = "https://github.com/Akastella/oss-paper-ci"
Documentation = "https://akastella.github.io/oss-paper-ci/"
Repository = "https://github.com/Akastella/oss-paper-ci"
Issues = "https://github.com/Akastella/oss-paper-ci/issues"
Changelog = "https://github.com/Akastella/oss-paper-ci/blob/main/CHANGELOG.md"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
