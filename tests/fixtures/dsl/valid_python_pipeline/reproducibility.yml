version: 1
project:
  name: demo-pipeline
  description: A simple train/evaluate pipeline
environments:
  default:
    adapter: python
    runtime: python
    python: ">=3.10"
    install:
      - requirements.txt
datasets:
  demo-data:
    path: data/
    required: true
    description: small demo dataset
steps:
  train:
    command: python scripts/train.py
    adapter: python
    needs: []
    produces:
      - results/model.json
    timeout: 60
  evaluate:
    command: python scripts/evaluate.py
    adapter: python
    needs: [train]
    produces:
      - results/metrics.json
    metrics:
      - path: results/metrics.json
        keys: [accuracy, f1]
artifacts:
  - results/metrics.json
  - figures/
expected:
  metrics:
    accuracy:
      min: 0.0
      max: 1.0
safety:
  network: false
  allow_install: false
  allow_gpu: false
