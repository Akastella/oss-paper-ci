version: 1
project:
  name: matrix-env-pipeline
  description: Pipeline with multiple environments for matrix testing
environments:
  py310:
    adapter: python
    runtime: python
    python: "3.10"
    install:
      - requirements.txt
  py311:
    adapter: python
    runtime: python
    python: "3.11"
    install:
      - requirements.txt
  py312:
    adapter: python
    runtime: python
    python: "3.12"
    install:
      - requirements.txt
datasets:
  demo-data:
    path: data/
    required: true
    description: demo data
steps:
  train:
    command: python scripts/train.py
    adapter: python
    needs: []
    produces:
      - results/model.json
    timeout: 60
  evaluate:
    command: python scripts/evaluate.py
    adapter: python
    needs: [train]
    produces:
      - results/metrics.json
    timeout: 30
artifacts:
  - results/metrics.json
expected:
  metrics:
    accuracy:
      min: 0.0
      max: 1.0
safety:
  network: false
  allow_install: false
  allow_gpu: false
